[project]
name = "ai-aip"
version = "0.1.0"
description = "O'Reilly AI AIP course"
requires-python = ">=3.13"
dependencies = [
    # LangChain & Ollama integration
    "langchain==0.3.26",
    "langchain-community==0.3.26",
    "langchain-ollama==0.3.3",
    "langchain-openai==0.3.0",
    # Agent frameworks
    "langgraph==0.4.9",
    "crewai==0.126.0",
    "smolagents==1.19.0",
    "autogen==0.9.4",
    "ag2==0.9.4",
    # Model Context Protocol (MCP) server/client
    "fastmcp==2.10.2",
    "pydantic>=2.11.7,<2.11.9",
    "uvicorn[standard]==0.29.0",
    # RAG stack
    "chromadb==1.3.0",
    # Utility libraries
    "openai==1.75.0",
    "tokenizers==0.21.2",
    "python-dotenv==1.1.1",
    "requests>=2.28",
    "httptools==0.6.4",
    "pdfminer-six==20231228",
    "sentence-transformers==4.1.0",
    "uvloop==0.21.0",
    "watchfiles==1.1.0",
    "fix-busted-json==0.0.18",
    "pandas==2.3.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]